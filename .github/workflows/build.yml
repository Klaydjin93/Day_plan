name: build

# Релиз выпускается сам: когда в main приходит версия из version.properties,
# для которой ещё нет тега vX.Y.Z, сборка создаёт тег и релиз с подписанным APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Тесты логики
        run: ./gradlew testDebugUnitTest --tests 'app.dayplan.PlanLogicTest'

      - name: Версия
        run: |
          V=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$V" ]; then echo "::error::Нет versionName в version.properties"; exit 1; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          RELEASE=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
              echo "Тег v$V уже есть — релиз не выпускается"
            else
              RELEASE=true
              echo "Новая версия $V — будет релиз"
            fi
          fi
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "::error::Нет секрета KEYSTORE_BASE64 — релиз без своего ключа не выпускается"
              exit 1
            fi
            echo "::warning::Секретов подписи нет — сборка подписана отладочным ключом, не для установки"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Сборка APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "dayplan-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: dayplan-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: dayplan-*.apk

      - name: Релиз для Obtainium
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: План дня ${{ env.VERSION_NAME }}
          files: dayplan-*.apk
          generate_release_notes: true
